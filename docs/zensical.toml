[project]
docs_dir = "src"
site_name = "uvr-core"
site_description = "Unbounded Viewstamped Replication Revisited (UVR) as an embeddable replication core: FFI-friendly and sans-I/O."
site_author = "Simon Massey"

nav = [
  { "Overview" = "index.md" },
  { "Architecture" = "architecture.md" },
  { "Protocols" = "uvr-protocols.md" },
  { "Fuse" = "uvr-fuse.md" },
  { "Durability Model" = "uvr-durability-model.md" },
  { "I/O Obligations" = "uvr-io-obligations.md" },
  { "Host Compliance" = "uvr-host-compliance.md" },
  { "Application Protocol" = "uvr-application-protocol.md" },
  { "Clients" = "clients.md" },
]

site_url = "https://lua-lunet.github.io/uvr-core/"
repo_url = "https://github.com/lua-lunet/uvr-core"
repo_name = "lua-lunet/uvr-core"

copyright = """
Copyright © 2026 Simon Massey
"""

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
