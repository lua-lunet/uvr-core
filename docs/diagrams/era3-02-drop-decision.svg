<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">The StartView receive decision that strands the joiner</title>
  <desc id="desc">Flow diagram comparing a one-era gap, which opens a fetch, with the observed two-era gap, which drops the StartView without retaining it or fetching configuration.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0l10 5-10 5z" fill="#344054"/></marker><style>
    .title{font:700 28px system-ui,sans-serif;fill:#132238}.sub{font:16px system-ui,sans-serif;fill:#475467}.box{fill:#eef4ff;stroke:#3972b7;stroke-width:2}.diamond{fill:#fff7e8;stroke:#dc6803;stroke-width:2}.good{fill:#ecfdf3;stroke:#039855;stroke-width:2}.bad{fill:#fff1f0;stroke:#d92d20;stroke-width:2}.t{font:16px system-ui,sans-serif;fill:#1d2939;text-anchor:middle}.h{font:700 17px system-ui,sans-serif;fill:#1d2939;text-anchor:middle}.edge{fill:none;stroke:#344054;stroke-width:2.5;marker-end:url(#a)}.lab{font:700 15px system-ui,sans-serif;fill:#475467}.code{font:15px ui-monospace,SFMono-Regular,monospace;fill:#344054;text-anchor:middle}.note{font:15px system-ui,sans-serif;fill:#475467}
  </style></defs>
  <rect width="1200" height="760" fill="#fff"/>
  <text x="48" y="48" class="title">2. The receive gate can bridge one era — not two</text>
  <text x="48" y="76" class="sub">This is the decision described for <tspan font-family="ui-monospace,monospace">plan_start_view</tspan> in upstream uvr-core v0.5.0.</text>

  <rect x="390" y="112" width="420" height="80" rx="12" class="box"/><text x="600" y="145" class="h">N5 receives StartView(era 3)</text><text x="600" y="171" class="t">local boot era = 1</text>
  <path d="M600 192V235" class="edge"/>
  <path d="M600 235L820 325 600 415 380 325Z" class="diamond"/>
  <text x="600" y="310" class="h">Does N5 already have the</text><text x="600" y="335" class="h">configuration for era 3?</text><text x="600" y="362" class="t">No</text>
  <path d="M380 325H235V450" class="edge"/><text x="270" y="310" class="lab">No config</text>
  <path d="M820 325H965V450" class="edge"/><text x="873" y="310" class="lab">Has config</text>

  <path d="M235 450L350 515 235 580 120 515Z" class="diamond"/>
  <text x="235" y="505" class="h">offered era =</text><text x="235" y="530" class="code">local era + 1?</text>
  <rect x="70" y="628" width="330" height="84" rx="10" class="bad"/><text x="235" y="657" class="h">Observed path: 3 ≠ 1 + 1</text><text x="235" y="682" class="t">drop as UnevaluableEra</text><text x="235" y="704" class="t">do not retain; do not fetch</text>
  <path d="M235 580V628" class="edge"/><text x="250" y="609" class="lab">No</text>

  <rect x="435" y="474" width="330" height="84" rx="10" class="good"/><text x="600" y="503" class="h">One-era-behind path</text><text x="600" y="528" class="t">retain the offer</text><text x="600" y="550" class="t">open configuration fetch</text>
  <path d="M350 515H435" class="edge"/><text x="372" y="500" class="lab">Yes</text>

  <rect x="835" y="474" width="260" height="84" rx="10" class="good"/><text x="965" y="507" class="h">Evaluate StartView</text><text x="965" y="533" class="t">continue protocol</text>
  <path d="M965 450V474" class="edge"/>

  <text x="435" y="635" class="note">The critical asymmetry:</text><text x="435" y="661" class="note">the message that could reveal the gap is discarded,</text><text x="435" y="687" class="note">and the recovery mechanism is never started.</text>
</svg>
