<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>agent366 — citation graph: strong consistency &amp; Homa</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; font-family: -apple-system, Helvetica, serif; background: #fff; }
  #chart { position: absolute; inset: 0; }
  #panel {
    position: absolute; top: 12px; right: 12px; width: 380px; max-height: 80%;
    overflow-y: auto; background: #fff; border: 1px solid #999; padding: 12px 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,.2); display: none; font-size: 13px; line-height: 1.45;
  }
  #panel h2 { font-size: 15px; margin: 0 0 4px; }
  #panel .meta { color: #555; margin: 0 0 8px; }
  #panel .abs { color: #222; margin: 0 0 8px; }
  #panel a { word-break: break-all; }
  #panel .close { float: right; cursor: pointer; font-weight: bold; }
  #controls {
    position: absolute; z-index: 10; top: 12px; left: 12px; width: min(390px, calc(100vw - 56px));
    box-sizing: border-box; background: #fff; border: 1px solid #999; padding: 10px 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,.18); font-size: 12px; line-height: 1.4;
  }
  #controls label { display: block; margin: 4px 0; }
  #controls input[type="file"] { display: block; max-width: 100%; margin: 5px 0; }
  #bib-search { box-sizing: border-box; width: 100%; margin: 7px 0 0; }
  #bib-results { max-height: 180px; overflow-y: auto; margin: 5px 0 0; }
  #bib-results button { display: block; width: 100%; border: 0; border-top: 1px solid #eee; background: #fff; padding: 5px 0; text-align: left; cursor: pointer; }
  #bib-results button:hover { background: #f3f7f7; }
  #bib-status { color: #555; margin: 5px 0 0; }
  #panel .bib-status { color: #555; font-size: 12px; }
  #legend-note { position: absolute; bottom: 8px; left: 12px; color: #666; font-size: 12px; }
</style>
</head>
<body>
<div id="chart"></div>
<section id="controls" aria-label="Bibliography filter">
  <label for="bib-file"><strong>Read Zotero collection exports</strong> (local, read-only)</label>
  <input id="bib-file" type="file" multiple accept=".bib,.bibtex,text/plain,application/x-bibtex">
  <label for="bib-collection">Collection export</label>
  <select id="bib-collection" disabled><option>Choose export files above</option></select>
  <label><input id="bib-only" type="checkbox" disabled> Show only graph works in the selected collection</label>
  <label for="bib-search">Find a loaded reference</label>
  <input id="bib-search" type="search" disabled placeholder="Search title, author, abstract, or citation key">
  <div id="bib-results" aria-live="polite"></div>
  <p id="bib-status" role="status" aria-live="polite">Reading the on-disk Zotero exports…</p>
</section>
<div id="panel"><span class="close" onclick="panel.style.display='none'">✕</span>
  <h2 id="p-title"></h2>
  <p class="meta" id="p-meta"></p>
  <p class="bib-status" id="p-bib"></p>
  <p class="abs" id="p-abs"></p>
  <p><a id="p-url" target="_blank" rel="noopener"></a></p>
  <p id="p-tags"></p>
  <p id="p-also"></p>
</div>
<div id="legend-note">Click a node for details. Drag to rearrange. After loading a .bib, teal outlines mark matching citation keys; the paper node stays as graph context.</div>
<script src="data.js"></script>
<script>
const chart = echarts.init(document.getElementById("chart"));
const nodeById = new Map(NODES.map(n => [n.id, n]));
const graphCategories = { ...CATEGORIES, bibliography: { name: "Zotero reference", color: "#6b7280" } };
const collectionExports = new Map();
let selectedCollection = null;
let filterToBibliography = false;

function activeBibliographyKeys() {
  return selectedCollection ? collectionExports.get(selectedCollection)?.keys ?? null : null;
}

function activeRecord(key) {
  return collectionExports.get(selectedCollection)?.records.find(record => record.key === key);
}

function recordURL(record) {
  return (/^https?:\/\//i.test(record?.url ?? "") ? record.url : "")
    || (record?.fields.doi ? `https://doi.org/${encodeURIComponent(record.fields.doi)}` : "")
    || (/^\d{4}\.\d{4,5}$/.test(record?.fields.eprint ?? "") ? `https://arxiv.org/abs/${record.fields.eprint}` : "")
    || (record ? `https://www.google.com/search?q=${encodeURIComponent(`"${record.title}" paper`)}` : "");
}

function recordLinkText(record) {
  if (!record) return "";
  return /^https?:\/\//i.test(record.url ?? "") || record.fields.doi || /^\d{4}\.\d{4,5}$/.test(record.fields.eprint ?? "")
    ? recordURL(record) : "Search for this title";
}

function graphNodes() {
  const bibliographyKeys = activeBibliographyKeys();
  const mapped = new Set(NODES.map(n => n.bibKey).filter(Boolean));
  const nodes = NODES
    .filter(n => !filterToBibliography || n.keepAsContext || (n.bibKey && bibliographyKeys.has(n.bibKey)))
    .map(n => {
      const isMatched = bibliographyKeys !== null && n.bibKey && bibliographyKeys.has(n.bibKey);
      return {
        id: n.id,
        name: n.name,
        category: Object.keys(graphCategories).indexOf(n.cat),
        symbolSize: n.cat === "uvrr" || n.cat === "raftLine" || n.cat === "homa" ? 34 : 24,
        label: { show: true, fontSize: 10, position: "right" },
        itemStyle: bibliographyKeys === null ? undefined : {
          borderColor: isMatched ? "#009688" : "#999",
          borderWidth: isMatched ? 3 : 1,
          opacity: isMatched || n.keepAsContext ? 1 : 0.55
        },
        value: n.id
      };
    });
  for (const record of collectionExports.get(selectedCollection)?.records ?? []) {
    if (!mapped.has(record.key)) {
      const id = `bib:${record.key}`;
      nodes.push({ id, value: id, name: record.title, category: Object.keys(graphCategories).indexOf("bibliography"),
        symbolSize: 21, label: { show: true, fontSize: 10, position: "right" },
        itemStyle: { borderColor: "#009688", borderWidth: 2 } });
    }
  }
  return nodes;
}

function graphLinks(visibleIds) {
  return EDGES
    .filter(([source, target]) => visibleIds.has(source) && visibleIds.has(target))
    .map(([source, target, note]) => ({
      source, target,
      tooltip: { formatter: `${source} → ${target}: ${note}` },
      lineStyle: { curveness: 0.15 },
      emphasis: { focus: "adjacency" }
    }));
}

function renderGraph() {
  const data = graphNodes();
  const visibleIds = new Set(data.map(n => n.id));
  const visibleCategories = [...new Set(data.map(n => n.id.startsWith("bib:") ? "bibliography" : nodeById.get(n.id)?.cat))]
    .filter(Boolean)
    .map(category => graphCategories[category].name);
  chart.setOption({
    legend: [{ data: visibleCategories }],
    series: [{ data, links: graphLinks(visibleIds) }]
  });
}

chart.setOption({
  tooltip: { show: true, confine: true },
  legend: [{ left: 12, top: 104, data: Object.values(CATEGORIES).map(c => c.name),
             textStyle: { fontSize: 11 } }],
  series: [{
    type: "graph", layout: "force", roam: true, draggable: true,
    force: { repulsion: 580, edgeLength: 140, gravity: 0.035 },
    edgeSymbol: ["none", "arrow"], edgeSymbolSize: 8,
    label: { show: true, formatter: p => nodeById.get(p.value)?.name ?? activeRecord(String(p.value).slice(4))?.title ?? String(p.value) },
    labelLayout: { hideOverlap: true },
    categories: Object.values(graphCategories).map(c => ({ name: c.name, itemStyle: { color: c.color } })),
    data: graphNodes(), links: graphLinks(new Set(NODES.map(n => n.id)))
  }]
});

const bibFile = document.getElementById("bib-file");
const bibCollection = document.getElementById("bib-collection");
const bibOnly = document.getElementById("bib-only");
const bibStatus = document.getElementById("bib-status");
const bibSearch = document.getElementById("bib-search");
const bibResults = document.getElementById("bib-results");

function skipBibEntry(source, openingAt, opening) {
  let braces = opening === "{" ? 1 : 0;
  let parentheses = opening === "(" ? 1 : 0;
  let quoted = false;
  for (let i = openingAt + 1; i < source.length; i++) {
    const ch = source[i];
    if (ch === "\\") { i++; continue; }
    if (ch === '"' && braces === 0) { quoted = !quoted; continue; }
    if (quoted) continue;
    if (ch === "{") { braces++; continue; }
    if (ch === "}") {
      if (braces > 0) braces--;
      else if (opening === "(") return i + 1;
      if (opening === "{" && braces === 0) return i + 1;
      continue;
    }
    if (opening === "(" && braces === 0) {
      if (ch === "(") parentheses++;
      else if (ch === ")" && --parentheses === 0) return i + 1;
    }
  }
  return source.length;
}

function cleanBibValue(value) {
  const accents = { "'": "\u0301", "`": "\u0300", "^": "\u0302", '"': "\u0308", "~": "\u0303", c: "\u0327", v: "\u030c", "=": "\u0304" };
  return value
    .replace(/\\(['`^"~cv=])\{?([A-Za-z])\}?/g, (_, mark, letter) => (letter + accents[mark]).normalize("NFC"))
    .replace(/\\textohm\{\}/g, "Ω")
    .replace(/\\textbackslash\s*n/g, " ")
    .replace(/[{}]/g, "")
    .replace(/\\([#%&_{}])/g, "$1")
    .replace(/\s+/g, " ").trim();
}

function readBibFields(body) {
  const fields = {};
  let i = 0;
  while (i < body.length) {
    while (/[\s,]/.test(body[i] ?? "")) i++;
    const start = i;
    while (/[\w-]/.test(body[i] ?? "")) i++;
    const name = body.slice(start, i).toLowerCase();
    while (/\s/.test(body[i] ?? "")) i++;
    if (!name || body[i] !== "=") { i++; continue; }
    i++;
    while (/\s/.test(body[i] ?? "")) i++;
    const opening = body[i];
    let value;
    if (opening === "{") {
      const start = ++i;
      let depth = 1;
      while (i < body.length && depth) {
        if (body[i] === "\\") { i += 2; continue; }
        if (body[i] === "{") depth++;
        if (body[i] === "}") depth--;
        i++;
      }
      value = body.slice(start, i - 1);
    } else if (opening === '"') {
      const start = ++i;
      while (i < body.length && body[i] !== '"') {
        if (body[i] === "\\") i++;
        i++;
      }
      value = body.slice(start, i++);
    } else {
      const start = i;
      while (i < body.length && body[i] !== ",") i++;
      value = body.slice(start, i);
    }
    fields[name] = cleanBibValue(value);
  }
  return fields;
}

function readBibTeX(source) {
  const keys = new Set();
  const records = [];
  let entries = 0;
  let i = 0;
  while (i < source.length) {
    if (source[i] === "%") {
      const lineEnd = source.indexOf("\n", i);
      i = lineEnd < 0 ? source.length : lineEnd + 1;
      continue;
    }
    if (source[i] !== "@") { i++; continue; }
    let j = i + 1;
    while (/\s/.test(source[j] ?? "")) j++;
    const typeStart = j;
    while (/[a-z]/i.test(source[j] ?? "")) j++;
    const type = source.slice(typeStart, j).toLowerCase();
    while (/\s/.test(source[j] ?? "")) j++;
    const opening = source[j];
    if (!type || (opening !== "{" && opening !== "(")) { i++; continue; }
    let keyStart = j + 1;
    while (/\s/.test(source[keyStart] ?? "")) keyStart++;
    let comma = keyStart;
    while (comma < source.length && source[comma] !== "," && source[comma] !== "}" && source[comma] !== ")") comma++;
    const key = source.slice(keyStart, comma).trim();
    const end = skipBibEntry(source, j, opening);
    if (comma < source.length && source[comma] === "," && key && !["comment", "preamble", "string"].includes(type)) {
      entries++;
      keys.add(key);
      const body = source.slice(comma + 1, end - 1);
      const fields = readBibFields(body);
      records.push({ key, type, title: fields.title || key, author: fields.author || "", abstract: fields.abstract || "", url: fields.url || "", year: fields.year || fields.date || "", fields });
    }
    i = Math.max(end, j + 1);
  }
  return { keys, entries, records };
}

function loadCollections(sources) {
  try {
    collectionExports.clear();
    for (const { name: originalName, source } of sources) {
      const parsed = typeof source === "string" ? readBibTeX(source) : {
        keys: new Set(source.records.map(record => record.key)),
        entries: source.records.length,
        records: source.records
      };
      if (parsed.entries === 0) throw new Error(`${originalName}: no BibTeX entries were found.`);
      const item = { name: originalName, ...parsed };
      let name = item.name;
      let suffix = 2;
      while (collectionExports.has(name)) name = `${item.name} (${suffix++})`;
      collectionExports.set(name, { keys: item.keys, entries: item.entries, records: item.records });
    }
    bibCollection.replaceChildren(...Array.from(collectionExports.keys(), name => new Option(name, name)));
    bibCollection.disabled = false;
    bibCollection.value = collectionExports.keys().next().value;
    selectedCollection = bibCollection.value;
    panel.style.display = "none";
    selectedNodeId = null;
    bibOnly.disabled = false;
    bibSearch.disabled = false;
    updateCollectionStatus();
    renderBibliographyResults();
    renderGraph();
    updatePanelStatus();
  } catch (error) {
    bibStatus.textContent = `Could not read collection exports: ${error.message}`;
  }
}

bibFile.addEventListener("change", async () => {
  const files = Array.from(bibFile.files ?? []);
  if (files.length === 0) return;
  // Clear the picker so choosing the same path again after an auto-export
  // updates still emits a change event.
  bibFile.value = "";
  loadCollections(await Promise.all(files.map(async file => ({ name: file.name, source: await file.text() }))));
});

async function loadDiskExports() {
  const paths = [
    ["references.bib", "../../paper/papers/references.bib", "bib"],
    ["consensus-paxos-vrr.json", "../consensus-paxos-vrr.json", "json"]
  ];
  const attempts = await Promise.allSettled(paths.map(async ([name, path, format]) => {
    const response = await fetch(path, { cache: "no-store" });
    if (!response.ok) throw new Error(`${path}: HTTP ${response.status}`);
    return { name, source: format === "json" ? await response.json() : await response.text() };
  }));
  const available = attempts.filter(result => result.status === "fulfilled").map(result => result.value);
  if (available.length) loadCollections(available);
  else bibStatus.textContent = "On-disk exports were unavailable. Choose one or more local .bib files above.";
}

function updateCollectionStatus() {
  const collection = collectionExports.get(selectedCollection);
  if (!collection) return;
  const mappedNodes = NODES.filter(n => n.bibKey && !n.keepAsContext);
  const matched = mappedNodes.filter(n => collection.keys.has(n.bibKey)).length;
  const absent = mappedNodes.length - matched;
  const unmapped = NODES.filter(n => !n.bibKey && !n.keepAsContext).length;
  bibStatus.textContent = `${selectedCollection}: read ${collection.entries} entries; ${matched} existing graph nodes match, ${collection.entries - matched} references appear as Zotero nodes, ${absent} mapped keys are absent, and ${unmapped} original graph nodes have no key mapping. Titles, metadata, abstracts, and links remain local to this browser tab.`;
}

bibCollection.addEventListener("change", () => {
  selectedCollection = bibCollection.value;
  panel.style.display = "none";
  selectedNodeId = null;
  updateCollectionStatus();
  renderBibliographyResults();
  renderGraph();
  updatePanelStatus();
});

function showBibliographyRecord(record) {
  selectedNodeId = null;
  document.getElementById("p-title").textContent = record.title;
  document.getElementById("p-meta").textContent = [record.author, record.year].filter(Boolean).join(" — ");
  document.getElementById("p-bib").textContent = `Loaded from ${selectedCollection} · key: ${record.key}`;
  document.getElementById("p-abs").textContent = record.abstract || "No abstract was exported for this item.";
  const a = document.getElementById("p-url");
  a.href = recordURL(record); a.textContent = recordLinkText(record);
  document.getElementById("p-tags").textContent = "";
  document.getElementById("p-also").textContent = "";
  panel.style.display = "block";
}

function renderBibliographyResults() {
  const records = collectionExports.get(selectedCollection)?.records ?? [];
  const query = bibSearch.value.trim().toLowerCase();
  const matched = records.filter(record => !query || [record.key, record.title, record.author, record.abstract].join(" ").toLowerCase().includes(query));
  bibResults.replaceChildren(...matched.slice(0, 80).map(record => {
    const button = document.createElement("button");
    button.type = "button";
    button.textContent = `${record.title}${record.author ? ` — ${record.author}` : ""}`;
    button.addEventListener("click", () => showBibliographyRecord(record));
    return button;
  }));
  if (matched.length > 80) bibResults.append(`Showing 80 of ${matched.length} matching records.`);
}

bibSearch.addEventListener("input", renderBibliographyResults);

bibOnly.addEventListener("change", () => {
  filterToBibliography = bibOnly.checked;
  renderGraph();
  updatePanelStatus();
});

const panel = document.getElementById("panel");
let selectedNodeId = null;
function updatePanelStatus() {
  if (!selectedNodeId) return;
  const n = nodeById.get(selectedNodeId);
  const bibliographyKeys = activeBibliographyKeys();
  const status = document.getElementById("p-bib");
  if (n.keepAsContext) {
    status.textContent = "Graph context node (not a bibliography entry).";
  } else if (!n.bibKey) {
    status.textContent = "No citation-key mapping is configured for this graph node.";
  } else if (bibliographyKeys === null) {
    status.textContent = `Collection membership not checked; expected key: ${n.bibKey}.`;
  } else {
    status.textContent = bibliographyKeys.has(n.bibKey)
      ? `Present in selected .bib export · key: ${n.bibKey}`
      : `Absent from selected .bib export · expected key: ${n.bibKey}`;
  }
}

chart.on("click", p => {
  if (String(p.value).startsWith("bib:")) {
    const record = activeRecord(String(p.value).slice(4));
    if (record) showBibliographyRecord(record);
    return;
  }
  const n = nodeById.get(p.value);
  if (!n) return;
  const record = n.bibKey ? activeRecord(n.bibKey) : null;
  selectedNodeId = n.id;
  document.getElementById("p-title").textContent = record?.title || n.name;
  document.getElementById("p-meta").textContent = record ? [record.author, record.year].filter(Boolean).join(" — ") : n.authors + " — " + n.venue;
  updatePanelStatus();
  document.getElementById("p-abs").textContent = record?.abstract || n.abstract;
  const a = document.getElementById("p-url");
  a.href = recordURL(record) || n.url; a.textContent = record ? recordLinkText(record) : n.url;
  const tags = document.getElementById("p-tags");
  tags.innerHTML = n.tags ? n.tags.map(t =>
    `<span style="display:inline-block;background:#eee;border-radius:3px;padding:1px 6px;margin:1px;font-size:11px">${t}</span>`).join("") : "";
  const also = document.getElementById("p-also");
  also.innerHTML = n.seeAlso && n.seeAlso.length
    ? "<b>See also:</b> " + n.seeAlso.map(id => {
        const o = NODES.find(x => x.id === id);
        return o ? `<a href="javascript:void 0" onclick="focusNode('${id}')">${o.name}</a>` : id;
      }).join(", ") : "";
  panel.style.display = "block";
});
function focusNode(id) {
  const n = nodeById.get(id);
  if (!n) return;
  const record = n.bibKey ? activeRecord(n.bibKey) : null;
  selectedNodeId = n.id;
  document.getElementById("p-title").textContent = record?.title || n.name;
  document.getElementById("p-meta").textContent = record ? [record.author, record.year].filter(Boolean).join(" — ") : n.authors + " — " + n.venue;
  updatePanelStatus();
  document.getElementById("p-abs").textContent = record?.abstract || n.abstract;
  const a = document.getElementById("p-url");
  a.href = recordURL(record) || n.url; a.textContent = record ? recordLinkText(record) : n.url;
  const tags = document.getElementById("p-tags");
  tags.innerHTML = n.tags ? n.tags.map(t =>
    `<span style="display:inline-block;background:#eee;border-radius:3px;padding:1px 6px;margin:1px;font-size:11px">${t}</span>`).join("") : "";
  const also = document.getElementById("p-also");
  also.innerHTML = n.seeAlso && n.seeAlso.length
    ? "<b>See also:</b> " + n.seeAlso.map(i => {
        const o = NODES.find(x => x.id === i);
        return o ? `<a href="javascript:void 0" onclick="focusNode('${i}')">${o.name}</a>` : i;
      }).join(", ") : "";
  panel.style.display = "block";
  chart.dispatchAction({ type: "highlight", seriesIndex: 0, name: n.name });
}
renderGraph();
loadDiskExports();
window.addEventListener("resize", () => chart.resize());
</script>
</body>
</html>
