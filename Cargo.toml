[package]
name = "uvrr-core"
version = "0.15.2"
edition = "2024"
# One toolchain rule, recorded beside the fields it governs: CI builds with
# exactly the toolchain the crate is built and released with locally,
# `rustc 1.96.0` (this `rust-version` field and the toolchain pinned in
# .github/workflows/ci.yml). There is no separate MSRV lane and no deliberate
# older pin: a toolchain exists to build this code, and any version CI does
# not share with the developers hides lint drift until it blocks a release.
# Raising the toolchain is a deliberate act that moves the three places at
# once. Edition 2024 requires 1.85, which sets this floor; clippy's msrv
# lints enforce it, so a newer API cannot creep in unnoticed.
rust-version = "1.96"
description = "Sans-io Viewstamped Replication Revisited core (normal operation, view change, recovery, state transfer) with a C ABI for LuaJIT FFI."
repository = "https://github.com/lua-lunet/uvrr-core"
license = "MIT"
readme = "README.md"
keywords = ["consensus", "replication", "viewstamped", "vsr", "raft"]
# Not a no-std category: the core uses Vec, BTreeMap and String.
categories = [
    "algorithms",
    "network-programming",
    "concurrency",
    "external-ffi-bindings",
]
exclude = ["maelstrom/", "store/", ".state/", "mise.toml", ".gitmodules"]

# `name = "uvrr"` deliberately differs from the package name. The cdylib and
# staticlib artifacts are named after the lib target, and the C ABI symbol
# prefix and the shared-object name a LuaJIT host dlopens are `uvrr`, not
# `uvrr_core`.
[lib]
name = "uvrr"
crate-type = ["rlib", "cdylib", "staticlib"]

# The Maelstrom node. A binary, not a second crate: it needs the library and
# nothing needs it, so it stays out of the published artifact's dependency
# graph while still being built and tested by `cargo test --all-targets`.
# Its dependencies (serde, serde_json) are the optional `maelstrom` feature's,
# so a default-features consumer never builds it.
[[bin]]
name = "maelstrom-lin-kv"
path = "src/bin/maelstrom-lin-kv/main.rs"
required-features = ["maelstrom"]

# The reconfiguration solver as the administrator's offline tool: given a
# current and a target configuration file, it prints the legal operation
# path as a per-slot plan (era and view each slot establishes, riders
# included). The solver is the library's own code, ungated and std-only.
[[bin]]
name = "uvrr-solve"
path = "src/bin/uvrr-solve/main.rs"

# The flavoured-timeout policy tool. A binary, not a second crate: it is living
# documentation for the timeout model, printing the matcher's opinion for a
# state and a timeout flavour on the command line, runbook included. Std
# only, no dependencies, no feature gate: the model is the library's own.
[[bin]]
name = "timeout-policy"
path = "src/bin/timeout-policy/main.rs"

# The TigerBeetle-superblock durability demo (examples/uvrr-reincarnation/).
# It links the static library extracted from TigerBeetle's own superblock
# source, which build.sh in that directory compiles with TigerBeetle's pinned
# Zig. Feature-gated so the default build, `make check`, and consumers never
# need the Zig toolchain; it carries no dependencies.
[[example]]
name = "uvrr-reincarnation"
path = "examples/uvrr-reincarnation/main.rs"
required-features = ["uvrr"]

# Every entry is optional, so a consumer's non-optional dependency set is empty
# and `default-features = false` pulls in zero transitive crates. Enforced by
# tests/manifest_contract.rs, which is a gate rather than a smoke test.
[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
# The datagram encryption codec the demo's real socket transport seals and
# opens with. Pinned by revision, never by branch or moving tag, so every
# build of this manifest is the same codec. `default-features = false` keeps
# paxe-core's C ABI (the LuaJIT host's `lunet_paxe_*` surface) out of this
# crate's link; what a Rust host uses is its modules. paxe-core carries no
# crate dependency of its own and links libsodium statically, so the entry
# adds no transitive crate to anyone's dependency graph: the only
# non-optional thing it asks of a build machine is a libsodium archive.
paxe-core = { git = "https://github.com/lua-lunet/paxe-core.git", rev = "a92242e5a87e3bcbc47331390ff47886ac765e34", default-features = false, optional = true }

# `serde` buys derives on the wire types only. It never becomes the wire format:
# the binary codec in `wire` is normative so the spec §13.1 suffix budget stays
# deterministic (decision P3). `maelstrom` adds the JSON debug bridge and the
# Maelstrom node binary. The `serde` lane also carries the plan codec: the
# JSONL plan artefact the leader's admin ingress accepts.
[features]
# Gates examples/uvrr-reincarnation only; no dependencies behind it.
uvrr = []
# Compile-time trace logging of the protocol's internal state at the top and
# the bottom of processing (the step boundary and every planner decision
# path). When the feature is off the macro expands to nothing — zero
# production overhead. Enable with --features trace.
trace = []
default = []
serde = ["dep:serde", "dep:serde_json"]
maelstrom = ["serde", "dep:serde_json"]
# The locks demo (`src/demo/`): the advisory locks over uVRR with the least
# environment. It rides the `serde` lane for the lock table's application
# payload codec, and the `paxe-core` lane for the real socket transport in
# `src/demo/paxe_transport.rs`, the one place this crate opens a socket or
# links cryptography. Nothing else in the crate does.
demo-locks = ["serde", "dep:paxe-core"]

# Build-time tooling for `cargo test`, not a consumer's supply chain: nothing here
# reaches a crate that depends on `uvrr-core`, and the [dependencies] gate above is
# what protects the consumer. Bounded by an explicit allowlist rather than left open
# — tests/manifest_contract.rs asserts this table names exactly {proptest,
# serde_json}, so a further entry requires a P3 amendment rather than a quiet commit.
[dev-dependencies]
proptest = "1.11.0"
serde_json = "1"
