name: Documentation

# The documentation site. Every push to main rebuilds and republishes
# https://lua-lunet.github.io/uvrr-core/ from the repository files: docs
# docs generates docs/src from the docs the tree already carries, zensical
# renders it into docs/site, and the Pages artifact lands on the site.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.13"
      - uses: actions/configure-pages@v6
      - name: Build documentation
        run: uv run --script docs/docs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/site
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v5
